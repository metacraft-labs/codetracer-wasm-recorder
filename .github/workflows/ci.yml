# CI — Lint, test, and build verification.
#
# This workflow runs on every push/PR and validates:
#   1. Go linting (go vet + nixfmt)
#   2. Pure-Go tests (no sibling repos needed)
#   3. Tracewriter FFI tests (requires codetracer-trace-format sibling)
#   4. Nix flake build verification
#
# POLICY: All CI steps should be reproducible locally via `just` targets.
# Local equivalents:
#   just lint
#   just test-tracewriter-go
#   just test-tracewriter        (requires FFI library from sibling)
#   just nix-build

name: CI

on:
  push:
    branches: [wasm-tracing, main, dev, stable]
  pull_request:
    branches: [wasm-tracing, main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format) at the workspace-lock-pinned revision
        # before materialising the nix env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Lint
        run: dev-exec just lint

      - name: Pure-Go tracewriter tests
        run: dev-exec just test-tracewriter-go

      - name: Build ct-print
        # The recorder tests decode recorded traces with ct-print from the
        # trace-format-nim sibling, built in that sibling's own dev shell (the
        # same way the shell hook builds its static library, which the tests
        # link through cgo).
        run: |
          cd ../codetracer-trace-format-nim
          nix develop --command nimble buildCtPrint

      - name: Test
        run: dev-exec just test

  nix-build:
    name: Verify nix flake packages build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Build default package
        run: nix build .#default
