# CI — Lint, test, and build verification.
#
# This workflow runs on every push/PR and validates:
#   1. Go linting (go vet + nixfmt)
#   2. Pure-Go tests (no sibling repos needed)
#   3. Tracewriter FFI tests (requires codetracer-trace-format sibling)
#   4. Nix flake build verification
#
# POLICY: All CI steps should be reproducible locally via `just` targets.
# Local equivalents:
#   just lint
#   just test-tracewriter-go
#   just test-tracewriter        (requires FFI library from sibling)
#   just nix-build

name: CI

on:
  push:
    branches: [wasm-tracing, main]
  pull_request:
    branches: [wasm-tracing, main]

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [incus, tart-linux-arm, macos-tart]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        # setup-dev-env clones the siblings listed in .github/sibling-repos
        # (codetracer-trace-format) at the workspace-lock-pinned revision
        # before materialising the nix env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Lint
        run: dev-exec just lint

      - name: Pure-Go tracewriter tests
        run: dev-exec just test-tracewriter-go

      - name: Build FFI library and run tracewriter tests
        run: |
          dev-exec bash -c '
            set -e

            # Build the FFI library from the sibling checkout
            cd ../codetracer-trace-format
            cargo build -p codetracer_trace_writer_ffi --release
            FFI_LIB_DIR="$(pwd)/target/release"

            # Run tracewriter tests with CGO linking to the FFI library
            cd "$GITHUB_WORKSPACE"
            CGO_ENABLED=1 \
            CGO_LDFLAGS="-L${FFI_LIB_DIR}" \
            LD_LIBRARY_PATH="${FFI_LIB_DIR}" \
              go test ./tracewriter/ -v
          '

  nix-build:
    name: Verify nix flake packages build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [incus, tart-linux-arm, macos-tart]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: Build default package
        run: nix build .#default
